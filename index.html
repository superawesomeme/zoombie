<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoombie Racing Simulator</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Rajdhani:wght@500;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="images/icons/android-chrome-512x512.png">
    <link rel="shortcut icon" href="images/icons/favicon.ico">
</head>
<body>

    <!-- Font preload warmup so Creepster glyphs are downloaded and ready for countdown -->
    <div style="font-family: 'Creepster'; position: absolute; left: -9999px; top: -9999px; opacity: 0.01; pointer-events: none;" aria-hidden="true">
        0 1 2 3 GO
    </div>

    <div id="canvas-container"></div>
    
    <canvas id="fireworks-canvas"></canvas>

    <div id="ui-layer">
        <div id="broadcast-header">
            <div class="live-tag"><div class="red-dot"></div> LIVE</div>
            <div class="event-title">
                <img src="images/logo/logo-white.svg" class="channel-logo" alt="PPSC TV">
                <span class="race-name" id="header-race-name">HAUNTED HIGHWAY GP</span>
            </div>
        </div>
        
        <div id="leaderboard">
            <div class="lb-title">POSITIONS</div>
            <div id="lb-content"></div>
        </div>

        <div id="telemetry-bar">
            <div class="telemetry-label">TRACK COMPLETION</div>
            <div class="telemetry-track"><div id="progress-fill"></div></div>
            <div class="telemetry-stat">LEADER SPEED: <span id="speed-stat">0</span> KM/H</div>
        </div>
    </div>

    <div id="start-screen">
        <div class="slate-container">
            <img src="images/zoombie-logo.png" alt="Zoombie Racing" class="start-screen-logo">
            
            <div class="control-group">
                <select id="race-select"></select>
            </div>

            <div class="preview-box">
                <div id="racer-preview" class="preview-grid"></div>
            </div>

            <div class="button-row">
                <button id="about-btn" class="secondary-btn">ABOUT</button>
                <div id="status-pill" class="status-pill status-amber">
                    <span class="status-dot"></span>
                    <span id="status-text">LOADING 0%</span>
                </div>
                <button id="start-btn">RACE!</button>
            </div>
        </div>
    </div>

    <div id="about-modal" class="hidden">
        <div class="modal-content">
            <h2>ABOUT</h2>
            <div id="about-content-container" class="about-text"></div>
            <div class="about-session-bar">
                <span>SESSION ID: <strong id="about-session-id">---</strong></span>
                <button id="new-session-btn" class="secondary-btn">NEW SESSION</button>
            </div>
            <div class="modal-buttons">
                <button id="close-about-btn">CLOSE</button>
            </div>
        </div>
    </div>

    <div id="end-screen" class="hidden">
        <div class="winner-slate">
            <div class="finish-flag">OFFICIAL RESULTS</div>
            <div id="winner-text">WINNER: ZOOMBIE #1</div>
            <div id="winner-payout-text"></div>
            <button id="restart-btn">NEXT RACE</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
