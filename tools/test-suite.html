<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zoombie Racing Simulator - Automated Test Suite</title>
    <link rel="shortcut icon" href="../images/icons/favicon.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <style>
        body { font-family: monospace; background: #120c1f; color: #e0e0e0; padding: 20px; }
        h1 { color: #ff6d00; }
        .pass { color: #76ff03; font-weight: bold; }
        .fail { color: #ff1744; font-weight: bold; }
        .info { color: #80d8ff; }
        pre { background: #1f1435; padding: 10px; border-radius: 4px; border: 1px solid #3d2966; }
        #summary { font-size: 1.2rem; margin-top: 20px; padding: 15px; border-radius: 6px; }
        .summary-pass { background: #1b5e20; color: #b9f6ca; }
        .summary-fail { background: #b71c1c; color: #ff8a80; }
    </style>
</head>
<body>
    <h1>ZOOMBIE GLB UPGRADE - VERIFICATION TEST SUITE</h1>
    <div id="log"></div>
    <div id="summary">Running tests...</div>

    <script>
        const logEl = document.getElementById('log');
        const summaryEl = document.getElementById('summary');
        let passCount = 0;
        let failCount = 0;

        function log(msg, cls = '') {
            console.log(msg);
            const div = document.createElement('div');
            div.className = cls;
            div.textContent = msg;
            logEl.appendChild(div);
        }

        function assert(condition, passMsg, failMsg) {
            if (condition) {
                passCount++;
                log('  ✓ ' + passMsg, 'pass');
                return true;
            } else {
                failCount++;
                log('  ✗ ' + failMsg, 'fail');
                return false;
            }
        }

        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        const MODELS = [
            { id: 0, name: 'Vampire',          file: '../models/vampire.glb',          expectedColor: 0xF42941 },
            { id: 1, name: 'Pumpkin Fiend',    file: '../models/pumpkin-fiend.glb',    expectedColor: 0xE9862A },
            { id: 2, name: 'Cursed Mummy',     file: '../models/cursed-mummy.glb',     expectedColor: 0xF0F136 },
            { id: 3, name: 'Franken-Zombie',   file: '../models/franken-zombie.glb',   expectedColor: 0x50C878 },
            { id: 4, name: 'Spectral Banshee', file: '../models/spectral-banshee.glb', expectedColor: 0x0033FF },
            { id: 5, name: 'Witch-Imp',        file: '../models/witch-imp.glb',        expectedColor: 0x6A2FA0 },
            { id: 6, name: 'Werewolf',         file: '../models/werewolf.glb',         expectedColor: 0x37474F },
            { id: 7, name: 'Skeleton',         file: '../models/skeleton.glb',         expectedColor: 0xF3F5F7 },
        ];

        const REQUIRED_NODES = ['Root', 'Body', 'Head', 'Arm_L', 'Arm_R', 'Leg_L', 'Leg_R', 'Extra'];

        async function runTests() {
            log('Starting GLB Loader & Rig Verification...', 'info');

            for (const m of MODELS) {
                log(`\nTesting Model #${m.id}: ${m.name} (${m.file})...`, 'info');

                try {
                    const gltf = await new Promise((resolve, reject) => {
                        loader.load(m.file, resolve, undefined, reject);
                    });

                    assert(!!gltf && !!gltf.scene, `${m.name} GLB loaded successfully`, `${m.name} failed to load`);

                    // Collect named nodes
                    const foundNodes = {};
                    let meshCount = 0;
                    let triCount = 0;

                    gltf.scene.traverse(child => {
                        if (REQUIRED_NODES.includes(child.name)) {
                            foundNodes[child.name] = child;
                        }
                        if (child.isMesh) {
                            meshCount++;
                            const geo = child.geometry;
                            if (geo.index) {
                                triCount += geo.index.count / 3;
                            } else if (geo.attributes.position) {
                                triCount += geo.attributes.position.count / 3;
                            }
                        }
                    });

                    // Verify required rig nodes
                    for (const nodeName of REQUIRED_NODES) {
                        assert(!!foundNodes[nodeName],
                            `Node "${nodeName}" found`,
                            `Node "${nodeName}" MISSING in ${m.name}`);
                    }

                    // Verify bounds and scale
                    const box = new THREE.Box3().setFromObject(gltf.scene);
                    const size = new THREE.Vector3();
                    box.getSize(size);

                    assert(meshCount > 0, `Contains ${meshCount} meshes (~${Math.round(triCount)} triangles)`, `No meshes found in ${m.name}`);
                    assert(size.y >= 3.0 && size.y <= 6.5,
                        `Height is reasonable: ${size.y.toFixed(2)} units`,
                        `Height out of range: ${size.y.toFixed(2)} (expected 3.0-6.5)`);
                    assert(box.min.y >= -0.2 && box.min.y <= 0.5,
                        `Origin aligns at/near ground level: min.y = ${box.min.y.toFixed(2)}`,
                        `Origin misaligned: min.y = ${box.min.y.toFixed(2)}`);

                    // Verify deep clone works
                    const clone = gltf.scene.clone(true);
                    assert(!!clone, `Scene graph deep-cloned successfully`, `Deep clone failed`);

                    // Verify named nodes in clone
                    const cloneNodes = {};
                    clone.traverse(child => {
                        if (REQUIRED_NODES.includes(child.name)) {
                            cloneNodes[child.name] = child;
                        }
                    });
                    assert(Object.keys(cloneNodes).length === REQUIRED_NODES.length,
                        `Clone preserves all ${REQUIRED_NODES.length} named rig nodes`,
                        `Clone lost named nodes: found ${Object.keys(cloneNodes).length}`);

                    // Verify animation transforms can be applied to clone nodes
                    cloneNodes['Arm_L'].rotation.x = -Math.PI / 2;
                    cloneNodes['Leg_R'].rotation.x = 0.5;
                    cloneNodes['Head'].rotation.y = 0.2;
                    clone.updateMatrixWorld(true);
                    assert(cloneNodes['Arm_L'].rotation.x === -Math.PI / 2, `Rig animation transform applied without error`, `Transform failed`);

                } catch (err) {
                    failCount++;
                    log(`  ✗ Exception loading ${m.name}: ${err.message}`, 'fail');
                }
            }

            // Summary
            log('\n========================================', 'info');
            log(`TEST SUITE COMPLETE: ${passCount} passed, ${failCount} failed.`);
            window.__TEST_RESULTS__ = { passCount, failCount, complete: true };

            if (failCount === 0) {
                summaryEl.className = 'summary-pass';
                summaryEl.textContent = `ALL ${passCount} TESTS PASSED! 8/8 GLB Racers Validated.`;
            } else {
                summaryEl.className = 'summary-fail';
                summaryEl.textContent = `TESTS FAILED: ${failCount} failure(s) out of ${passCount + failCount} checks.`;
            }
        }

        runTests();
    </script>
</body>
</html>
