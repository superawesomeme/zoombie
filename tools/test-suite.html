<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zoombie Racing Simulator - Claymation Arcade Test Suite</title>
    <link rel="shortcut icon" href="../images/icons/favicon.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <style>
        body { font-family: monospace; background: #120c1f; color: #e0e0e0; padding: 20px; }
        h1 { color: #ff6d00; }
        .pass { color: #76ff03; font-weight: bold; }
        .fail { color: #ff1744; font-weight: bold; }
        .info { color: #80d8ff; }
        pre { background: #1f1435; padding: 10px; border-radius: 4px; border: 1px solid #3d2966; }
        #summary { font-size: 1.2rem; margin-top: 20px; padding: 15px; border-radius: 6px; }
        .summary-pass { background: #1b5e20; color: #b9f6ca; }
        .summary-fail { background: #b71c1c; color: #ff8a80; }
    </style>
</head>
<body>
    <h1>ZOOMBIE RACING - CLAYMATION ASSET & ARCADE VERIFICATION</h1>
    <div id="log"></div>
    <div id="summary">Running tests...</div>

    <script>
        const logEl = document.getElementById('log');
        const summaryEl = document.getElementById('summary');
        let passCount = 0;
        let failCount = 0;

        function log(msg, cls = '') {
            console.log(msg);
            const div = document.createElement('div');
            div.className = cls;
            div.textContent = msg;
            logEl.appendChild(div);
        }

        function assert(condition, passMsg, failMsg) {
            if (condition) {
                passCount++;
                log('  ✓ ' + passMsg, 'pass');
                return true;
            } else {
                failCount++;
                log('  ✗ ' + failMsg, 'fail');
                return false;
            }
        }

        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        const MODELS = [
            { id: 0, name: 'Vampire',  file: '../models/vampire.glb',  rotY: 0 },
            { id: 1, name: 'Pumpkin',  file: '../models/pumpkin.glb',  rotY: 0 },
            { id: 2, name: 'Mummy',    file: '../models/mummy.glb',    rotY: 0 },
            { id: 3, name: 'Monster',  file: '../models/monster.glb',  rotY: 0 },
            { id: 4, name: 'Ghost',    file: '../models/ghost.glb',    rotY: 0 },
            { id: 5, name: 'Witch',    file: '../models/witch.glb',    rotY: Math.PI / 2 },
            { id: 6, name: 'Werewolf', file: '../models/werewolf.glb', rotY: Math.PI / 2 },
            { id: 7, name: 'Skeleton', file: '../models/skeleton.glb', rotY: 0 }
        ];

        async function runTests() {
            log('Starting Claymation GLB Asset & Arcade System Verification...', 'info');

            // 1. Validate All 8 Character Racers
            for (const m of MODELS) {
                log(`\nTesting Racer #${m.id + 1}: ${m.name} (${m.file})...`, 'info');

                try {
                    const gltf = await new Promise((resolve, reject) => {
                        loader.load(m.file, resolve, undefined, reject);
                    });

                    assert(!!gltf && !!gltf.scene, `${m.name} GLB loaded cleanly via DRACOLoader`, `${m.name} failed to load`);

                    let meshCount = 0;
                    let vertCount = 0;

                    gltf.scene.traverse(child => {
                        if (child.isMesh) {
                            meshCount++;
                            const geo = child.geometry;
                            if (geo.attributes.position) {
                                vertCount += geo.attributes.position.count;
                            }
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    assert(meshCount > 0, `Solid clay mesh confirmed (${vertCount} vertices)`, `No meshes found in ${m.name}`);

                    // Verify rotation alignment
                    if (m.rotY) gltf.scene.rotation.y = m.rotY;
                    gltf.scene.updateMatrixWorld(true);

                    const box = new THREE.Box3().setFromObject(gltf.scene);
                    const size = new THREE.Vector3();
                    box.getSize(size);

                    assert(size.z >= 1.8 && size.z <= 2.1,
                        `Normalized kart length along Z is ~1.90 units (actual: ${size.z.toFixed(2)})`,
                        `Unexpected kart length: ${size.z.toFixed(2)}`);

                    // Verify deep clone
                    const clone = gltf.scene.clone(true);
                    assert(!!clone, `Deep-cloned successfully for racer instantiation`, `Deep clone failed`);

                } catch (err) {
                    failCount++;
                    log(`  ✗ Exception loading ${m.name}: ${err.message}`, 'fail');
                }
            }

            // 2. Validate Environment tree.glb (white plane removal & corridor tree extraction)
            log('\nTesting Environment: tree.glb & White Floor Plane Cleanup...', 'info');
            try {
                const treeGltf = await new Promise((resolve, reject) => {
                    loader.load('../models/tree.glb', resolve, undefined, reject);
                });

                let planeFound = false;
                const treeTemplates = [];

                treeGltf.scene.traverse((child) => {
                    if (child.isMesh) {
                        const name = (child.name || '').toLowerCase();
                        const parentName = (child.parent?.name || '').toLowerCase();
                        const matName = (Array.isArray(child.material) 
                            ? child.material.map(m => m.name || '').join(' ') 
                            : (child.material?.name || '')).toLowerCase();

                        if (name.includes('plane') || parentName.includes('plane') || matName.includes('plane')) {
                            planeFound = true;
                            if (child.parent) child.parent.remove(child);
                            child.geometry?.dispose();
                            return;
                        }

                        treeTemplates.push(child);
                    }
                });

                assert(planeFound, 'Unwanted white floor plane identified and removed', 'White floor plane not found in tree.glb');
                assert(treeTemplates.length >= 10, `Extracted ${treeTemplates.length} individual tree templates for haunted forest corridor`, 'Failed to extract trees');

            } catch (err) {
                failCount++;
                log(`  ✗ Exception in tree.glb test: ${err.message}`, 'fail');
            }

            // 3. Validate Environment grave.glb
            log('\nTesting Environment: grave.glb...', 'info');
            try {
                const graveGltf = await new Promise((resolve, reject) => {
                    loader.load('../models/grave.glb', resolve, undefined, reject);
                });

                let graveMeshes = 0;
                graveGltf.scene.traverse(c => { if (c.isMesh) graveMeshes++; });

                assert(graveMeshes >= 4, `grave.glb loaded with ${graveMeshes} obstacle/scenery meshes`, 'grave.glb mesh count unexpected');

            } catch (err) {
                failCount++;
                log(`  ✗ Exception in grave.glb test: ${err.message}`, 'fail');
            }

            // Report final summary
            const passed = failCount === 0;
            summaryEl.className = passed ? 'summary-pass' : 'summary-fail';
            summaryEl.textContent = passed
                ? `ALL TESTS PASSED (${passCount}/${passCount})`
                : `TESTS FAILED (${failCount} errors, ${passCount} passed)`;

            window.__TEST_RESULTS__ = {
                complete: true,
                passCount,
                failCount,
                passed
            };
        }

        window.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
